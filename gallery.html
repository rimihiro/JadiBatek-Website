<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Batik Gallery - JadiBatek</title>

<style>

/* BASIC */

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: Arial, sans-serif;

    background-image: url('DSC09613.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}


/* HEADER */

header {
    background-color: white;
    padding: 12px 70px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo img {
    width: 155px;
    height: 80px;
    object-fit: contain;
    display: block;
}


/* NAVIGATION */

nav ul {
    list-style: none;
    display: flex;
    align-items: center;
    gap: 30px;
    margin: 0;
    padding: 0;
}

nav ul li a {
    text-decoration: none;
    color: #333333;
    font-family: Arial, sans-serif;
    font-size: 16px;
    font-weight: 600;
    transition: color 0.2s ease;
}

nav ul li a:hover {
    color: #8b542f;
}


/* GALLERY SECTION */

.motif-section {
    flex: 1;
    text-align: center;
    padding: 60px 10%;
    color: white;
}

.motif-section h1 {
    font-size: 40px;
    text-shadow: 2px 2px 5px black;
}

.motif-section p {
    font-size: 18px;
    text-shadow: 2px 2px 5px black;
}


/* SLIDER */

.slider {
    position: relative;
    max-width: 1000px;
    margin: 40px auto;
    overflow: hidden;
}

.slider-container {
    display: flex;
    transition: transform 0.5s ease;
}

.slide {
    min-width: 100%;
}

.slide img {
    width: 100%;
    height: 500px;
    object-fit: cover;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    display: block;
}


/* SLIDER BUTTONS */

.prev,
.next {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);

    background-color: rgba(0,0,0,0.7);
    color: white;
    border: none;
    font-size: 30px;
    padding: 12px 18px;
    cursor: pointer;
    border-radius: 50%;
}

.prev {
    left: 20px;
}

.next {
    right: 20px;
}

.prev:hover,
.next:hover {
    background-color: #4a2c1a;
}


/* FOOTER */

footer {
    background-color: #2b1b14;
    color: white;
    text-align: center;
    padding: 20px;
    margin-top: auto;
}

footer p {
    margin: 0;
}


/* TABLET */

@media (max-width: 900px) {

    header {
        padding: 12px 25px;
        flex-wrap: wrap;
        gap: 10px;
    }

    nav ul {
        gap: 15px;
        flex-wrap: wrap;
    }

    .motif-section {
        padding: 40px 5%;
    }

}


/* MOBILE */

@media (max-width: 600px) {

    header {
        flex-direction: column;
    }

    nav ul {
        gap: 12px 18px;
        justify-content: center;
    }

    nav ul li a {
        font-size: 14px;
    }

    .motif-section h1 {
        font-size: 32px;
    }

    .motif-section p {
        font-size: 16px;
    }

    .slide img {
        height: 300px;
    }

    .prev,
    .next {
        font-size: 22px;
        padding: 9px 13px;
    }

}

</style>

</head>

<body>


<!-- HEADER -->

<header>

    <div class="logo">
        <img src="LOGO 2.png" alt="JadiBatek Logo">
    </div>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="video.html">Video</a></li>
            <li><a href="booking.html">Booking</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

</header>


<!-- GALLERY SECTION -->

<section class="motif-section">

    <h1>Batik Gallery</h1>

    <p>
        Explore the beautiful and unique motifs of Malaysian Batik.
    </p>

    <!-- SLIDER -->

    <div class="slider">

        <div class="slider-container" id="sliderContainer">

            <div class="slide">
                <img src="DSC09620.jpg" alt="Motif Batik 1">
            </div>

            <div class="slide">
                <img src="DSC09617.jpg" alt="Motif Batik 2">
            </div>

            <div class="slide">
                <img src="DSC09564.jpg" alt="Motif Batik 3">
            </div>

        </div>

        <button class="prev"
                onclick="previousSlide()"
                aria-label="Previous image">
            &#10094;
        </button>

        <button class="next"
                onclick="nextSlide()"
                aria-label="Next image">
            &#10095;
        </button>

    </div>

</section>


<!-- FOOTER -->

<footer>
    <p>© 2026 JadiBatek. All Rights Reserved.</p>
</footer>


<!-- SLIDER JAVASCRIPT -->

<script>

let currentSlide = 0;

const slides = document.querySelectorAll(".slide");

const sliderContainer =
    document.getElementById("sliderContainer");

function showSlide() {
    sliderContainer.style.transform =
        "translateX(-" + currentSlide * 100 + "%)";
}

function nextSlide() {
    currentSlide++;

    if (currentSlide >= slides.length) {
        currentSlide = 0;
    }

    showSlide();
}

function previousSlide() {
    currentSlide--;

    if (currentSlide < 0) {
        currentSlide = slides.length - 1;
    }

    showSlide();
}

</script>

</body>
</html>
