<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Promotion Video</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: Arial, sans-serif;

    background-image: url('DSC09570.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

/* HEADER */

header {
    background-color: white;
    padding: 12px 70px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo img {
    width: 155px;
    height: 80px;
    object-fit: contain;
    display: block;
}

nav ul {
    list-style: none;
    display: flex;
    align-items: center;
    gap: 30px;
    margin: 0;
    padding: 0;
}

nav ul li a {
    text-decoration: none;
    color: #333333;
    font-family: Arial, sans-serif;
    font-size: 16px;
    font-weight: 600;
    transition: color 0.2s ease;
}

nav ul li a:hover {
    color: #8b542f;
}

/* VIDEO SECTION */

.video {
    flex: 1;
    text-align: center;
    padding: 60px 20px;
    color: white;
}

.video h1 {
    color: white;
    font-size: 40px;
    margin-bottom: 20px;
}

.video p {
    color: white;
    font-size: 18px;
    line-height: 1.6;
    margin-bottom: 30px;
}

/* VIDEO */

.video video {
    width: 800px;
    max-width: 100%;
    height: auto;
    border-radius: 5px;
}

/* BUTTON */

.btn {
    display: inline-block;
    background-color: #4a2c1a;
    color: white;
    padding: 12px 25px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
    transition: background-color 0.3s ease;
}

.btn:hover {
    background-color: #70452b;
}

/* FOOTER */

footer {
    background-color: black;
    color: white;
    text-align: center;
    padding: 15px;
    margin-top: auto;
}

footer p {
    margin: 0;
}

/* RESPONSIVE */

@media (max-width: 900px) {
    header {
        padding: 12px 25px;
        flex-wrap: wrap;
        gap: 10px;
    }

    nav ul {
        gap: 15px;
        flex-wrap: wrap;
    }
}

@media (max-width: 600px) {
    header {
        flex-direction: column;
        justify-content: center;
    }

    nav ul {
        gap: 12px 18px;
        justify-content: center;
    }

    nav ul li a {
        font-size: 14px;
    }

    .video {
        padding: 40px 15px;
    }

    .video h1 {
        font-size: 30px;
    }

    .video p {
        font-size: 16px;
    }
}
</style>

</head>

<body>

<header>

    <div class="logo">
        <img src="LOGO 2.png" alt="JadiBatek Logo">
    </div>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="video.html">Video</a></li>
            <li><a href="booking.html">Booking</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

</header>

<section class="video">

    <h1>Promotion Video</h1>

    <p>
        Watch our promotional video to discover the beauty of Malaysian Batik.
    </p>

    <video controls>
        <source src="Marvel's Spider-Man Remastered v3.618.0.0 2025-02-20 23-34-03.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <br><br>

    <a href="index.html" class="btn">Return Home</a>

</section>

<footer>
    <p>© 2026 JadiBatek. All Rights Reserved.</p>
</footer>

</body>
</html>
